- name: Configure backend servers
  hosts: backend
  become: yes

  tasks:

    - name: Install Netdata
      shell: curl -s https://my-netdata.io/kickstart.sh | bash
      args:
        creates: /usr/sbin/netdata

    - name: Ensure Netdata running
      service:
        name: netdata
        state: started
        enabled: yes
