- name: Configure all Linux hosts
  hosts: all
  become: yes

  tasks:
    - name: Disable SELinux
      ansible.posix.selinux:
        state: disabled
      ignore_errors: yes

    - name: Stop firewalld
      service:
        name: firewalld
        state: stopped
        enabled: no
      ignore_errors: yes

- name: Configure frontend
  hosts: frontend
  become: yes

  tasks:
    - name: Install nginx
      package:
        name: nginx
        state: present

    - name: Configure nginx reverse proxy
      copy:
        dest: /etc/nginx/conf.d/netdata.conf
        content: |
          server {
              listen 80;

              location / {
                  proxy_pass http://{{ hostvars[groups['backend'][0]].ansible_host }}:19999;
              }
          }

    - name: Start nginx
      service:
        name: nginx
        state: started
        enabled: yes


- name: Configure backend
  hosts: backend
  become: yes

  tasks:
    - name: Install Netdata
      shell: bash <(curl -Ss https://my-netdata.io/kickstart.sh)
      args:
        executable: /bin/bash

    - name: Ensure Netdata running
      service:
        name: netdata
        state: started
        enabled: yes
